<!-- subject: New device on your {{appName}} account -->
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#18181b;">A new device was added</h1>
<p style="margin:0 0 16px 0;">Hi {{name}}, this device can now use your {{appName}} account:</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;background-color:#f4f4f5;border-radius:8px;width:100%;">
  <tr>
    <td style="padding:10px 16px 4px 16px;font-size:14px;color:#52525b;">Device</td>
    <td style="padding:10px 16px 4px 16px;font-size:14px;font-weight:600;color:#18181b;text-align:right;">{{deviceName}}</td>
  </tr>
  <tr>
    <td style="padding:4px 16px;font-size:14px;color:#52525b;">Device ID</td>
    <td style="padding:4px 16px;font-size:13px;font-family:Menlo,Consolas,monospace;color:#18181b;text-align:right;">{{deviceUid}}</td>
  </tr>
  <tr>
    <td style="padding:4px 16px 10px 16px;font-size:14px;color:#52525b;">When</td>
    <td style="padding:4px 16px 10px 16px;font-size:14px;color:#18181b;text-align:right;">{{when}}</td>
  </tr>
</table>
<p style="margin:0;">If this wasn't you, contact us right away at <a href="mailto:{{supportEmail}}" style="color:#2563eb;text-decoration:none;">{{supportEmail}}</a>.</p>
