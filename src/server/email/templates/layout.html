<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 4px 16px 4px;font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;color:#18181b;">
                {{appName}}
              </td>
            </tr>
            <tr>
              <td style="background-color:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:32px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#27272a;">
                {{{content}}}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 4px 0 4px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#71717a;">
                You received this email because of your account {{email}} on {{appName}}.<br />
                © {{year}} {{platformName}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
