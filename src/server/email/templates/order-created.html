<!-- subject: Your {{appName}} order {{orderNumber}} -->
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#18181b;">Thanks for your order, {{name}}</h1>
<p style="margin:0 0 16px 0;">Order <strong>{{orderNumber}}</strong> · {{billing}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;width:100%;border-collapse:collapse;">
  {{{itemRows}}}
  <tr>
    <td style="padding:12px 0 0 0;font-size:15px;font-weight:700;color:#18181b;">Total</td>
    <td style="padding:12px 0 0 0;font-size:15px;font-weight:700;color:#18181b;text-align:right;">{{total}}</td>
  </tr>
</table>
{{#payUrl}}
<p style="margin:24px 0 8px 0;">Your order starts as soon as it's paid:</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
  <tr>
    <td style="border-radius:8px;background-color:#18181b;">
      <a href="{{payUrl}}" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Pay {{total}}</a>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;color:#71717a;">This payment link works until {{payUntil}}.</p>
{{/payUrl}}
