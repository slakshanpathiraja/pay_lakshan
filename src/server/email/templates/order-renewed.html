<!-- subject: Your {{appName}} subscription renewed · {{orderNumber}} -->
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#18181b;">Your subscription renewed</h1>
<p style="margin:0 0 16px 0;">Hi {{name}}, thank you! Your {{item}} subscription continues.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;background-color:#f4f4f5;border-radius:8px;width:100%;">
  <tr>
    <td style="padding:10px 16px 4px 16px;font-size:14px;color:#52525b;">Order</td>
    <td style="padding:10px 16px 4px 16px;font-size:14px;font-weight:600;color:#18181b;text-align:right;">{{orderNumber}}</td>
  </tr>
  <tr>
    <td style="padding:4px 16px;font-size:14px;color:#52525b;">Plan</td>
    <td style="padding:4px 16px;font-size:14px;color:#18181b;text-align:right;">{{billing}}</td>
  </tr>
  {{#amount}}
  <tr>
    <td style="padding:4px 16px;font-size:14px;color:#52525b;">Paid</td>
    <td style="padding:4px 16px;font-size:14px;color:#18181b;text-align:right;">{{amount}}</td>
  </tr>
  {{/amount}}
  <tr>
    <td style="padding:4px 16px 10px 16px;font-size:14px;color:#52525b;">Active until</td>
    <td style="padding:4px 16px 10px 16px;font-size:14px;font-weight:600;color:#18181b;text-align:right;">{{until}}</td>
  </tr>
</table>
<p style="margin:0;">Questions? Write to <a href="mailto:{{supportEmail}}" style="color:#2563eb;text-decoration:none;">{{supportEmail}}</a>.</p>
