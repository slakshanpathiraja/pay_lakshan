<!-- subject: {{headline}} · {{orderNumber}} -->
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#18181b;">{{headline}}</h1>
<p style="margin:0 0 16px 0;">Hi {{name}}, {{message}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;background-color:#f4f4f5;border-radius:8px;width:100%;">
  <tr>
    <td style="padding:10px 16px 4px 16px;font-size:14px;color:#52525b;">Order</td>
    <td style="padding:10px 16px 4px 16px;font-size:14px;font-weight:600;color:#18181b;text-align:right;">{{orderNumber}}</td>
  </tr>
  <tr>
    <td style="padding:4px 16px;font-size:14px;color:#52525b;">Payment</td>
    <td style="padding:4px 16px;font-size:14px;color:#18181b;text-align:right;">{{paymentStatus}}</td>
  </tr>
  <tr>
    <td style="padding:4px 16px 10px 16px;font-size:14px;color:#52525b;">Status</td>
    <td style="padding:4px 16px 10px 16px;font-size:14px;color:#18181b;text-align:right;">{{orderStatus}}</td>
  </tr>
</table>
{{#payUrl}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
  <tr>
    <td style="border-radius:8px;background-color:#18181b;">
      <a href="{{payUrl}}" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Pay now</a>
    </td>
  </tr>
</table>
{{/payUrl}}
<p style="margin:0;">Questions? Write to <a href="mailto:{{supportEmail}}" style="color:#2563eb;text-decoration:none;">{{supportEmail}}</a>.</p>
