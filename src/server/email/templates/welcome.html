<!-- subject: Welcome to {{appName}} -->
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#18181b;">Welcome, {{name}}!</h1>
<p style="margin:0 0 16px 0;">Your {{appName}} account is ready. You can sign in with:</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;background-color:#f4f4f5;border-radius:8px;width:100%;">
  <tr>
    <td style="padding:12px 16px;font-size:14px;color:#52525b;">Email</td>
    <td style="padding:12px 16px;font-size:14px;font-weight:600;color:#18181b;text-align:right;">{{email}}</td>
  </tr>
</table>
<p style="margin:0 0 16px 0;">If you didn't create this account, you can ignore this email, or let us know and we'll look into it.</p>
<p style="margin:0;">Questions? Just reply, or write to <a href="mailto:{{supportEmail}}" style="color:#2563eb;text-decoration:none;">{{supportEmail}}</a>.</p>
<p style="margin:24px 0 0 0;color:#52525b;">— The {{appName}} team</p>
